name: walklingo
description: "WalkLingo — học tiếng Anh khi đi bộ."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.6

  just_audio: ^0.9.42
  audio_session: ^0.1.21

  pedometer: ^4.0.1
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1

  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1

  http: ^1.2.2
  xml: ^6.5.0
  just_audio_background: ^0.0.1-beta.17
  wakelock_plus: ^1.6.0
  table_calendar: ^3.2.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.1
  fl_chart: ^1.2.0
  connectivity_plus: ^7.2.0
  liquid_glass_bar: ^0.1.1
  liquid_glass_renderer: ^0.2.0-dev.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/word_suggestions.json
